<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintSpeak | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="brand-header border-b">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="./index.html" class="text-xl font-semibold" style="color: var(--brand-primary);">PrintSpeak</a>
      <div class="flex gap-5 text-sm font-medium">
        <a class="brand-link" href="./index.html">Home</a>
        <a class="brand-link" href="./about.html">About</a>
        <a class="brand-link" href="./team.html">Team</a>
        <a class="brand-link" href="./blog.html">Blog</a>
        <a class="brand-link active" href="./contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-16">
    <h1 class="text-4xl font-bold">Contact</h1>
    <p class="mt-4 text-slate-600">Need support or want to discuss your next brand page? We would love to hear from you.</p>

    <form class="mt-8 space-y-4 rounded-xl border border-slate-200 bg-white p-6">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="name">Name</label>
        <input id="name" type="text" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="email">Email</label>
        <input id="email" type="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700" for="message">Message</label>
        <textarea id="message" rows="4" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none"></textarea>
      </div>
      <button type="submit" class="brand-button rounded-lg px-5 py-2 text-sm font-semibold">Send Message</button>
    </form>
  </main>

  <footer class="brand-footer border-t">
    <div class="mx-auto max-w-6xl px-6 py-5 text-sm text-slate-500">© 2026 PrintSpeak</div>
  </footer>
</body>
</html>
