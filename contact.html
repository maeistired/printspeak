<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintSpeak | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="brand-header border-b">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="./index.html" class="text-xl font-semibold text-primary">PrintSpeak</a>
      <div class="flex gap-5 text-sm font-medium">
        <a class="brand-link" href="./index.html">Home</a>
        <a class="brand-link" href="./about.html">About</a>
        <a class="brand-link" href="./team.html">Team</a>
        <a class="brand-link" href="./blog.html">Blog</a>
        <a class="brand-link" href="./contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-24">
    <h1 class="text-4xl text-primary md:text-5xl">Contact</h1>
    <p class="mt-5 text-lg">Need support or want to discuss your next brand page? We would love to hear from you.</p>

    <form class="card mt-12 space-y-4">
      <div>
        <label class="mb-1 block font-bold text-primary" for="name">Name</label>
        <input id="name" type="text" class="form-input" />
      </div>
      <div>
        <label class="mb-1 block font-bold text-primary" for="email">Email</label>
        <input id="email" type="email" class="form-input" />
      </div>
      <div>
        <label class="mb-1 block font-bold text-primary" for="message">Message</label>
        <textarea id="message" rows="4" class="form-input"></textarea>
      </div>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer class="brand-footer border-t">
    <div class="mx-auto flex max-w-6xl justify-between px-6 py-5 text-sm text-slate-500">
      <p>© 2026 PrintSpeak</p>
      <p>Built with HTML, CSS and Tailwind</p>
    </div>
  </footer>
</body>
</html>
