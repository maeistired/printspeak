<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./img/favicon.png" />
  <title>PrintSpeak | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind-config.js"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./js/site-nav.js" defer></script>
</head>
<body>
  <header id="site-nav">
    <noscript>
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./team.html">Team</a>
      <a href="./blog.html">Blog</a>
      <a href="./contact.html">Contact</a>
    </noscript>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-24">
    <h1 class="text-4xl text-primary md:text-5xl">Contact</h1>
    <p class="mt-5 text-lg">Need support or want to discuss your next brand page? We would love to hear from you.</p>
    <p class="mt-5 text-lg">
      Prefer email?
      <a class="font-bold text-accent underline underline-offset-4" data-site-email href="mailto:">
        <span data-site-email-text></span>
      </a>
    </p>

    <noscript>
      <p class="mt-5">Email us at <a href="mailto:official.printspeak&#64;gmail.com">official.printspeak&#64;gmail.com</a>.</p>
    </noscript>

    <p class="form-status mt-8" data-form-status role="status" hidden>Thanks! Your message has been sent.</p>

    <form class="card contact-form mt-8 space-y-4" method="POST" data-site-form>
      <input type="hidden" name="_subject" value="New message from printspeak.ca" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_next" value="" />
      <input class="visually-hidden" type="text" name="_honey" tabindex="-1" autocomplete="off" />
      <div>
        <label class="mb-1 block font-bold text-primary" for="name">Name</label>
        <input id="name" name="name" type="text" class="form-input" required />
      </div>
      <div>
        <label class="mb-1 block font-bold text-primary" for="email">Email</label>
        <input id="email" name="email" type="email" class="form-input" required />
      </div>
      <div>
        <label class="mb-1 block font-bold text-primary" for="message">Message</label>
        <textarea id="message" name="message" rows="4" class="form-input" required></textarea>
      </div>
      <button type="submit" class="btn">Send message</button>
    </form>
  </main>

  <footer id="site-footer">
    <noscript>
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./team.html">Team</a>
      <a href="./blog.html">Blog</a>
      <a href="./contact.html">Contact</a>
    </noscript>
  </footer>
</body>
</html>
