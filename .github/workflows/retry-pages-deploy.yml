name: Retry failed Pages deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed deploy job
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const deployFailed = data.jobs.some(
              (job) => job.name === 'deploy' && job.conclusion === 'failure'
            );

            if (!deployFailed) {
              core.info('Workflow failed, but deploy job was not the failing job. Skipping retry.');
              return;
            }

            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              }
            );

            core.info(`Requested retry for failed jobs in workflow run ${run.id}.`);
